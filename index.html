<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Maya: Simulasi Anyaman Bilah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            overflow-x: hidden;
        }
        /* Custom scrollbar for control panel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        canvas {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            background-color: transparent;
            cursor: pointer;
            touch-action: none; /* Prevent scrolling when touching canvas */
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col md:flex-row">

    <aside class="w-full md:w-80 bg-white shadow-xl h-auto md:h-screen flex flex-col z-10 overflow-y-auto">
        <div class="p-6 border-b border-gray-100 bg-emerald-600 text-white">
            <h1 class="text-2xl font-bold">Lab Anyaman</h1>
            <p class="text-sm text-emerald-100 mt-1">Simulasi Anyaman Persegi Panjang</p>
        </div>

        <div class="p-6 flex-1 flex flex-col gap-6">
            <!-- Instructions -->
            <div class="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm border border-blue-100">
                <strong>Cara Penggunaan:</strong><br>
                Klik pada area persilangan di kanvas untuk mengubah posisi bilah mana yang berada di atas.
            </div>

            <!-- Controls: Size -->
            <div>
                <h3 class="font-semibold text-gray-700 mb-3 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    Ukuran Matriks
                </h3>
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1">Bilah Vertikal (Lungsi): <span id="colVal" class="font-bold text-emerald-600">10</span></label>
                    <input type="range" id="cols" min="4" max="30" value="10" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-emerald-600">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">Bilah Horizontal (Pakan): <span id="rowVal" class="font-bold text-emerald-600">10</span></label>
                    <input type="range" id="rows" min="4" max="30" value="10" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-emerald-600">
                </div>
            </div>

            <hr class="border-gray-100">

            <!-- Controls: Colors -->
            <div>
                <h3 class="font-semibold text-gray-700 mb-3 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                    Pewarnaan Bilah
                </h3>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">Vertikal</label>
                        <input type="color" id="colorWarp" value="#FDE68A" class="w-full h-10 rounded cursor-pointer border-0 p-0">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">Horizontal</label>
                        <input type="color" id="colorWeft" value="#D97706" class="w-full h-10 rounded cursor-pointer border-0 p-0">
                    </div>
                </div>
            </div>

            <hr class="border-gray-100">

            <!-- Controls: Patterns -->
            <div>
                <h3 class="font-semibold text-gray-700 mb-3 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Pola Otomatis
                </h3>
                <div class="grid grid-cols-1 gap-2">
                    <button onclick="applyPattern('tunggal')" class="w-full py-2 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg transition text-sm text-left border border-gray-200">
                        Anyaman Tunggal (1/1)
                    </button>
                    <button onclick="applyPattern('kepang')" class="w-full py-2 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg transition text-sm text-left border border-gray-200">
                        Anyaman Kepang (2/2)
                    </button>
                    <button onclick="applyPattern('reset')" class="w-full py-2 px-4 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition text-sm text-left border border-red-100 mt-2">
                        Kosongkan (Reset)
                    </button>
                </div>
            </div>
            
            <div class="mt-auto pt-4 text-xs text-center text-gray-400">
                Lab Maya Anyaman &copy; 2026
            </div>
        </div>
    </aside>

    <!-- Main Canvas Area -->
    <main class="flex-1 bg-gray-200 flex flex-col h-screen overflow-hidden relative" id="canvasContainer">
        <!-- Toolbar inside canvas area -->
        <div class="absolute top-4 right-4 z-20 flex gap-2">
             <button onclick="downloadImage()" class="py-2 px-4 bg-white/90 backdrop-blur shadow-sm hover:bg-white text-gray-800 rounded-full transition text-sm font-medium border border-gray-200 flex items-center">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Simpan Gambar
            </button>
        </div>
        
        <div class="flex-1 w-full h-full p-4 md:p-8 flex justify-center items-center overflow-auto">
            <!-- Container to maintain aspect ratio dynamically -->
            <div id="canvasWrapper" class="relative max-w-full max-h-full">
                <canvas id="weavingCanvas" class="bg-white rounded border border-gray-300"></canvas>
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const canvas = document.getElementById('weavingCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasWrapper');
        const mainArea = document.getElementById('canvasContainer');
        
        // Controls
        const colsInput = document.getElementById('cols');
        const rowsInput = document.getElementById('rows');
        const colorWarpInput = document.getElementById('colorWarp');
        const colorWeftInput = document.getElementById('colorWeft');
        const colValText = document.getElementById('colVal');
        const rowValText = document.getElementById('rowVal');

        // State Variables
        let cols = parseInt(colsInput.value);
        let rows = parseInt(rowsInput.value);
        let colorWarp = colorWarpInput.value;
        let colorWeft = colorWeftInput.value;
        let grid = []; // 0 = Warp (Vertical) on top, 1 = Weft (Horizontal) on top

        // Dimensions
        let cellW = 0;
        let cellH = 0;
        let padding = 10; // Padding inside canvas

        // Initialize grid matrix
        function initGrid() {
            grid = [];
            for (let r = 0; r < rows; r++) {
                let rowArray = [];
                for (let c = 0; c < cols; c++) {
                    // Default to alternate to look slightly like weaving initially
                    rowArray.push((r + c) % 2 === 0 ? 0 : 1);
                }
                grid.push(rowArray);
            }
        }

        // Resize canvas to fit screen while maintaining grid aspect ratio
        function resizeCanvas() {
            // Get available space
            const maxWidth = mainArea.clientWidth - 64; // 32px padding on each side
            const maxHeight = mainArea.clientHeight - 64;

            // Calculate ideal cell size (square cells look best for standard weaving)
            const maxCellWidth = (maxWidth - padding * 2) / cols;
            const maxCellHeight = (maxHeight - padding * 2) / rows;
            const size = Math.min(maxCellWidth, maxCellHeight, 60); // Cap cell size at 60px

            cellW = size;
            cellH = size;

            canvas.width = (cellW * cols) + (padding * 2);
            canvas.height = (cellH * rows) + (padding * 2);

            drawWeaving();
        }

        // Draw the weaving pattern
        function drawWeaving() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fill background with a very subtle pattern or flat color representing empty space
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw base layers (Draw EVERYTHING as if it's below)
            
            // Draw all Warp (Vertical) strips
            for (let c = 0; c < cols; c++) {
                let x = padding + c * cellW;
                let y = padding;
                let h = rows * cellH;
                
                ctx.fillStyle = colorWarp;
                ctx.fillRect(x, y, cellW, h);
                
                // Add vertical borders for depth
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y); ctx.lineTo(x, y + h);
                ctx.moveTo(x + cellW, y); ctx.lineTo(x + cellW, y + h);
                ctx.stroke();
            }

            // Draw all Weft (Horizontal) strips on top of the base warp
            for (let r = 0; r < rows; r++) {
                let x = padding;
                let y = padding + r * cellH;
                let w = cols * cellW;
                
                ctx.fillStyle = colorWeft;
                ctx.fillRect(x, y, w, cellH);
                
                // Add horizontal borders for depth
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y); ctx.lineTo(x + w, y);
                ctx.moveTo(x, y + cellH); ctx.lineTo(x + w, y + cellH);
                ctx.stroke();
            }

            // 2. Draw overlaps based on grid matrix to create the weaving illusion
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let x = padding + c * cellW;
                    let y = padding + r * cellH;

                    if (grid[r][c] === 0) {
                        // Warp (Vertical) is ON TOP here. We need to re-draw this square of Warp
                        ctx.fillStyle = colorWarp;
                        // Slightly enlarge the fill to prevent sub-pixel gaps
                        ctx.fillRect(x, y - 0.5, cellW, cellH + 1);

                        // Draw borders for this segment
                        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x, y); ctx.lineTo(x, y + cellH);
                        ctx.moveTo(x + cellW, y); ctx.lineTo(x + cellW, y + cellH);
                        ctx.stroke();

                        // Add 3D Shadow above and below
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        ctx.fillRect(x, y - 3, cellW, 3); // Shadow bleeding UP
                        ctx.fillRect(x, y + cellH, cellW, 3); // Shadow bleeding DOWN

                    } else {
                        // Weft (Horizontal) is ON TOP here. We re-draw this square of Weft
                        ctx.fillStyle = colorWeft;
                        ctx.fillRect(x - 0.5, y, cellW + 1, cellH);

                        // Draw borders
                        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x, y); ctx.lineTo(x + cellW, y);
                        ctx.moveTo(x, y + cellH); ctx.lineTo(x + cellW, y + cellH);
                        ctx.stroke();

                        // Add 3D Shadow left and right
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        ctx.fillRect(x - 3, y, 3, cellH); // Shadow bleeding LEFT
                        ctx.fillRect(x + cellW, y, 3, cellH); // Shadow bleeding RIGHT
                    }
                }
            }
        }

        // Handle Canvas Clicks
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            
            // Get coordinates relative to canvas internal resolution
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX - padding;
            const y = (e.clientY - rect.top) * scaleY - padding;

            // Determine which cell was clicked
            const c = Math.floor(x / cellW);
            const r = Math.floor(y / cellH);

            // Toggle state if within bounds
            if (r >= 0 && r < rows && c >= 0 && c < cols) {
                grid[r][c] = grid[r][c] === 0 ? 1 : 0;
                drawWeaving();
            }
        });

        // Touch support for mobile (prevents scroll, triggers click)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('click', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, { passive: false });

        // Apply patterns automatically
        function applyPattern(type) {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (type === 'tunggal') {
                        // Plain weave: alternating every step
                        grid[r][c] = (r + c) % 2 === 0 ? 0 : 1;
                    } else if (type === 'kepang') {
                        // Twill weave (2/2): shifts by 1 each row
                        // Pattern: Warp, Warp, Weft, Weft -> 0, 0, 1, 1
                        let val = (c - r) % 4;
                        if (val < 0) val += 4; // handle negative modulo
                        grid[r][c] = (val === 0 || val === 1) ? 0 : 1;
                    } else if (type === 'reset') {
                        // All warp on top (blank canvas basically)
                        grid[r][c] = 0;
                    }
                }
            }
            drawWeaving();
        }

        // Handle Input Changes
        colsInput.addEventListener('input', (e) => {
            cols = parseInt(e.target.value);
            colValText.innerText = cols;
            // Re-init grid but try to preserve existing data where possible
            let newGrid = [];
            for (let r = 0; r < rows; r++) {
                let newRow = [];
                for (let c = 0; c < cols; c++) {
                    if (grid[r] && grid[r][c] !== undefined) {
                        newRow.push(grid[r][c]);
                    } else {
                        newRow.push((r + c) % 2 === 0 ? 0 : 1);
                    }
                }
                newGrid.push(newRow);
            }
            grid = newGrid;
            resizeCanvas();
        });

        rowsInput.addEventListener('input', (e) => {
            rows = parseInt(e.target.value);
            rowValText.innerText = rows;
            
            let newGrid = [];
            for (let r = 0; r < rows; r++) {
                let newRow = [];
                for (let c = 0; c < cols; c++) {
                    if (grid[r] && grid[r][c] !== undefined) {
                        newRow.push(grid[r][c]);
                    } else {
                        newRow.push((r + c) % 2 === 0 ? 0 : 1);
                    }
                }
                newGrid.push(newRow);
            }
            grid = newGrid;
            resizeCanvas();
        });

        colorWarpInput.addEventListener('input', (e) => {
            colorWarp = e.target.value;
            drawWeaving();
        });

        colorWeftInput.addEventListener('input', (e) => {
            colorWeft = e.target.value;
            drawWeaving();
        });

        // Window resize handler
        window.addEventListener('resize', resizeCanvas);

        // Download Image Function
        function downloadImage() {
            const link = document.createElement('a');
            link.download = `anyaman-${cols}x${rows}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Initialize application
        window.onload = () => {
            initGrid();
            resizeCanvas();
        };

    </script>
</body>
</html>
